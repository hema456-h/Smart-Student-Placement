{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card">
  <h1>Admin login</h1>
  <p class="muted">For placement officers only.</p>
  <form method="post" novalidate>
    {{ csrf_input }}
    <div class="form-grid">
      <div class="full"><label for="email">Admin email</label><input id="email" name="email" type="email" required autocomplete="username"></div>
      <div class="full"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    </div>
    <div class="form-actions"><button class="btn" type="submit">Log in as admin</button></div>
  </form>
  <p class="small muted" style="margin-top:1rem">Student? <a href="{{ url_for('login') }}">Go to student login</a>.</p>
</div></div>
{% endblock %}
