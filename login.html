{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card">
  <h1>Student login</h1>
  <p class="muted">Sign in to view jobs, check eligibility and track your applications.</p>
  <form method="post" novalidate>
    {{ csrf_input }}
    <div class="form-grid">
      <div class="full"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></div>
      <div class="full"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    </div>
    <div class="form-actions"><button class="btn" type="submit">Log in</button></div>
  </form>
  <p class="small muted" style="margin-top:1rem">New here? <a href="{{ url_for('register') }}">Create a student account</a>. Placement officer? <a href="{{ url_for('admin_login') }}">Admin login</a>.</p>
</div></div>
{% endblock %}
