{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card" style="width:min(720px,92vw)">
  <h1>Create your student account</h1>
  <p class="muted">Your details are used to check eligibility for each company automatically.</p>
  <form method="post" novalidate>
    {{ csrf_input }}
    <div class="form-grid">
      <div class="full"><label for="name">Full name</label><input id="name" name="name" required minlength="3" value="{{ form.name }}"></div>
      <div><label for="register_number">Register number</label><input id="register_number" name="register_number" required pattern="[A-Za-z0-9\-/]{4,20}" value="{{ form.register_number }}"></div>
      <div><label for="phone">Phone number</label><input id="phone" name="phone" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" value="{{ form.phone }}"><div class="hint">10 digits</div></div>
      <div class="full"><label for="email">Email</label><input id="email" name="email" type="email" required value="{{ form.email }}"></div>
      <div><label for="password">Password</label><input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"><div class="hint">At least 6 characters</div></div>
      <div><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" required autocomplete="new-password"></div>
      <div><label for="department">Department</label>
        <select id="department" name="department" required><option value="">Select</option>
        {% for d in DEPARTMENTS %}<option {{ 'selected' if form.department == d }}>{{ d }}</option>{% endfor %}</select></div>
      <div><label for="year">Graduation year</label>
        <select id="year" name="year" required><option value="">Select</option>
        {% for y in years %}<option value="{{ y }}" {{ 'selected' if form.year == y|string }}>{{ y }}</option>{% endfor %}</select></div>
      <div><label for="cgpa">CGPA</label><input id="cgpa" name="cgpa" type="number" step="0.01" min="0" max="10" required value="{{ form.cgpa }}"></div>
    </div>
    <div class="form-actions"><button class="btn" type="submit">Create account</button><a class="btn btn-outline" href="{{ url_for('login') }}">I already have an account</a></div>
  </form>
</div></div>
{% endblock %}
